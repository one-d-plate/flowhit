[package]
name = "flowhit-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart"] }
thiserror = "2"
base64 = "0.22"
regex = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
