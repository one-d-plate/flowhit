async function reloadTree(selFile) {
  const t = await api('/api/tree');

  const _srvF = new Set();
  (t.cols || []).forEach(g => (g.folders || []).forEach(f => _srvF.add(g.name + '|' + f.name)));
  S._localFol = (S._localFol || []).filter(k => !_srvF.has(k));
  const keep = (S.cols || []).filter(c => c.requests.length === 0 && (c.folders || []).every(f => f.requests.length === 0) && !S._serverCols.includes(c.name));
  const keepFol = [];
  (S.cols || []).forEach(c => { (c.folders || []).forEach(f => { if (f.requests.length === 0 && (S._localFol || []).includes(c.name + '|' + f.name)) keepFol.push({ c: c.name, f }); }); });
  S.cols = (t.cols || []).map(g => ({ name: g.name, icon: g.icon || '', requests: (g.requests || []).map(r => ({ file: r.file, name: r.name, method: r.method, url: r.url, body: r.body || '', params: (r.params || []).map(p => ({ k: p.k || '', v: p.v || '', on: p.on !== false })), tests: (r.tests || []).map(t => ({ t: t.t || 'status', v: t.v || '', on: t.on !== false })), prescript: r.prescript || '', body_mode: r.body_mode === 'form' ? 'form' : 'json', form: (r.form || []).map(f => ({ k: f.k || '', v: f.v || '', t: f.t === 'file' ? 'file' : 'text', on: f.on !== false })), headers: normHeaders(r.headers), authMode: ['bearer', 'basic', 'apikey'].includes(r.auth_mode) ? r.auth_mode : 'none' })), folders: (g.folders || []).map(f => ({ name: f.name, icon: f.icon || '', requests: (f.requests || []).map(r => ({ file: r.file, name: r.name, method: r.method, url: r.url, body: r.body || '', params: (r.params || []).map(p => ({ k: p.k || '', v: p.v || '', on: p.on !== false })), tests: (r.tests || []).map(t => ({ t: t.t || 'status', v: t.v || '', on: t.on !== false })), prescript: r.prescript || '', body_mode: r.body_mode === 'form' ? 'form' : 'json', form: (r.form || []).map(f => ({ k: f.k || '', v: f.v || '', t: f.t === 'file' ? 'file' : 'text', on: f.on !== false })), headers: normHeaders(r.headers), authMode: ['bearer', 'basic', 'apikey'].includes(r.auth_mode) ? r.auth_mode : 'none' })) })) }));
  if (selFile) {
    outer: for (let ci = 0; ci < S.cols.length; ci++) {
      const c = S.cols[ci];
      for (let i = 0; i < c.requests.length; i++) {
        if (c.requests[i].file === selFile) { S.sel = { c: ci, f: -1, i }; break outer; }
      }
      for (let fi = 0; fi < c.folders.length; fi++) {
        for (let i = 0; i < c.folders[fi].requests.length; i++) {
          if (c.folders[fi].requests[i].file === selFile) { S.sel = { c: ci, f: fi, i }; break outer; }
        }
      }
    }
  }
  if (S.sel && !cur() && flatCount()) S.sel = { c: 0, f: -1, i: 0 };
  validTabs();
  keep.forEach(k => { if (!S.cols.find(c => c.name === k.name)) S.cols.push(k); });
  keepFol.forEach(k => { const c = S.cols.find(x => x.name === k.c); if (c && !c.folders.find(x => x.name === k.f.name)) c.folders.push(k.f); });
  S.flows = flowMapList(t);
  render();
}

function drawBuddy() {
  const cv = document.getElementById('buddy');
  if (!cv) return;
  const cx = cv.getContext('2d');
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const t = Date.now();
  const m = (S.buddySleep || S.autoSleep) ? 'sleep' : S.sending ? 'send' : (t < S.moodUntil ? S.mood : 'idle');
  const FR = {
    atas: [38, 95, 232, 195], ataskanan: [297, 95, 239, 195], kanan: [553, 95, 233, 195], bawahkanan: [806, 95, 233, 195], bawah: [1053, 95, 241, 195],
    bawahkiri: [74, 330, 246, 176], kiri: [338, 330, 246, 176], ataskiri: [613, 330, 244, 176], tengah: [893, 330, 245, 176],
    mengantuk: [12, 649, 160, 171], matasetengah: [171, 649, 166, 171], tertidur: [336, 624, 163, 196], bangun: [501, 638, 159, 182],
    pikir: [673, 638, 161, 182], bingung: [842, 638, 150, 182], tangandagu: [996, 638, 146, 182], ide: [1148, 638, 152, 182],
    senyum: [4, 977, 234, 135], matatertutup: [242, 958, 218, 154], senanghati: [464, 933, 207, 179], excited: [675, 933, 208, 179], malu: [887, 955, 206, 157], tertawa: [1097, 955, 195, 157]
  };
  const FSZ = n => [FR[n][2], FR[n][3]];
  const FIT = n => Math.min(96 / FR[n][2], 92 / FR[n][3]);
  if (!drawBuddy._img) { drawBuddy._img = new Image(); drawBuddy._img.src = 'buddy-sheet.png'; }
  const typing = !!(document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName));
  const m2 = (m === 'idle' && typing && !RM) ? 'thinking' : m;
  const seq = S.seq && t < S.seq.t0 + S.seq.dur ? S.seq : null;
  let f = 'tengah';
  if (seq) { f = seq.frames[Math.min(seq.frames.length - 1, Math.floor((t - seq.t0) / seq.step))]; }
  else if (m2 === 'sleep') f = ['mengantuk', 'matasetengah', 'tertidur', 'matasetengah'][Math.floor(t / 1200) % 4];
  else if (m2 === 'happy') f = 'senanghati';
  else if (m2 === 'err500') f = 'tengah';
  else if (m2 === 'dizzy') f = 'bingung';
  else if (m2 === 'send' || m2 === 'thinking') f = ['pikir', 'bingung', 'tangandagu', 'ide'][Math.floor(t / 700) % 4];
  else if (!RM) {
    const r = cv.getBoundingClientRect();
    const dx = (drawBuddy._mx || 0) - (r.left + r.width / 2), dy = (drawBuddy._my || 0) - (r.top + r.height / 2);
    const D = drawBuddy;
    const hx = dx > 70 ? 1 : dx < -70 ? -1 : (dx > -40 && dx < 40 ? 0 : (D._hx || 0));
    const hy = dy > 60 ? 1 : dy < -60 ? -1 : (dy > -40 && dy < 40 ? 0 : (D._hy || 0));
    D._hx = hx; D._hy = hy;
    f = hy < 0 ? (hx < 0 ? 'ataskiri' : hx > 0 ? 'ataskanan' : 'atas') : hy > 0 ? (hx < 0 ? 'bawahkiri' : hx > 0 ? 'bawahkanan' : 'bawah') : (hx < 0 ? 'kiri' : hx > 0 ? 'kanan' : 'tengah');
  }
  const force = location.hash.match(/^#buddy=([a-z]+)$/);
  if (force && FR[force[1]]) f = force[1];
  let yOff = 0, xOff = 0;
  if (!RM && (m2 === 'send' || (seq && seq.bounce))) yOff = -Math.abs(Math.sin(t / 130)) * 3;
  if (!RM && m2 === 'happy') yOff = -Math.abs(Math.sin(t / 200)) * 2;
  if (!RM && m2 === 'dizzy') xOff = Math.round(Math.sin(t / 150)) * 2;
  if (drawBuddy._cur !== f) { drawBuddy._prev = drawBuddy._cur; drawBuddy._t0 = t; drawBuddy._cur = f; }
  const k = RM ? 1 : Math.min(1, (t - (drawBuddy._t0 || 0)) / 150);
  const getCell = n => {
    if (!drawBuddy._cache) drawBuddy._cache = {};
    if (!drawBuddy._cache[n] && drawBuddy._img.complete && drawBuddy._img.naturalWidth) {
      const [sx, sy] = FR[n], [sw, sh] = FSZ(n);
      const s = FIT(n);
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(sw * s)); c.height = Math.max(1, Math.round(sh * s));
      c.getContext('2d').drawImage(drawBuddy._img, sx, sy, sw, sh, 0, 0, c.width, c.height);
      drawBuddy._cache[n] = c;
    }
    return drawBuddy._cache[n] || null;
  };
  const blit = (n, a) => {
    const c = getCell(n); if (!c) return;
    cx.globalAlpha = a;
    cx.drawImage(c, (96 - c.width) / 2 + xOff, 96 - c.height + yOff);
  };
  cx.clearRect(0, 0, 96, 96);
  if (k < 1 && drawBuddy._prev && FR[drawBuddy._prev]) blit(drawBuddy._prev, 1 - k);
  if (FR[f]) blit(f, RM ? 1 : k);
  if (m2 === 'sleep') {
    cx.fillStyle = '#c9a7ff'; cx.textAlign = 'center';
    if (RM) { cx.globalAlpha = 1; cx.font = 'bold 13px monospace'; cx.fillText('Z', 78, 22); }
    else for (let i = 0; i < 3; i++) {
      const ph = ((t / 900) + i / 3) % 1;
      cx.globalAlpha = 1 - ph;
      cx.font = 'bold ' + (10 + i * 3) + 'px monospace';
      cx.fillText('Z', 68 + i * 8, 36 - ph * 24);
    }
  }
  cx.globalAlpha = 1;
}

}

function applyPrescript(url, headers, prescript) {
  const preH = {};
  let delay = 0;
  String(prescript || '').split('\n').forEach(ln => {
    const l = ln.trim(); if (!l || l.startsWith('#')) return;
    let m = l.match(/^header\s+([^:]+):\s*(.*)$/i); if (m) { preH[m[1].trim()] = m[2]; return; }
    m = l.match(/^param\s+([^=]+)=(.*)$/i); if (m && m[1].trim()) { url += (url.includes('?') ? '&' : '?') + encodeURIComponent(m[1].trim()) + '=' + encodeURIComponent(m[2]); return; }
    m = l.match(/^delay\s+(\d+)/i); if (m) delay = Math.min(5000, +m[1]);
  });
  Object.assign(headers, preH);
  return { url, delay };
}
async function composeSend(q) {
  let url = document.getElementById('url').value;
  const qs = (q.params || []).filter(p => p.on !== false && (p.k || '').trim()).map(p => encodeURIComponent(p.k.trim()) + '=' + encodeURIComponent(p.v || '')).join('&');
  if (qs) url += (url.includes('?') ? '&' : '?') + qs;
  const headers = flatHeaders(q.headers);
  if (!Object.keys(headers).some(k => k.toLowerCase() === 'content-type')) headers['Content-Type'] = 'application/json';
  const pre = applyPrescript(url, headers, q.prescript);
  url = pre.url;
  const delay = pre.delay;
  jarHeader(url, headers);
  const body = document.getElementById('body') ? document.getElementById('body').value : q.body;
  const isForm = q.body_mode === 'form';
  const form = [], files = [];
  if (isForm) {
    for (const k of Object.keys(headers)) { if (k.toLowerCase() === 'content-type') delete headers[k]; }
    for (const f of (q.form || [])) {
      if (f.on === false || !(f.k || '').trim()) continue;
      if (f.t === 'file') {
        if (f._file) {
          try { files.push({ k: f.k.trim(), filename: f._file.name, b64: await readFileB64(f._file) }); }
          catch (e) { /* skip unreadable */ }
        }
      } else form.push({ k: f.k.trim(), v: f.v || '' });
    }
  }
  return { method: q.method, url, headers, body, delay, isForm, form, files, authMode: q.authMode || 'none' };
}

const shQ = s => "'" + String(s).replace(/'/g, "'\\''") + "'";
const toCurl = c => {
  const parts = ['curl', '-X', c.method, shQ(c.url)];
  for (const [k, v] of Object.entries(c.headers)) parts.push('-H', shQ(k + ': ' + v));
  if (c.authMode === 'bearer' && S.token) parts.push('-H', shQ('Authorization: Bearer ' + S.token));
  else if (c.authMode === 'basic' && (S.basicUser || S.basicPass)) parts.push('-H', shQ('Authorization: Basic ' + btoa(S.basicUser + ':' + S.basicPass)));
  else if (c.authMode === 'apikey' && S.apiVal) parts.push('-H', shQ((S.apiKey.trim() || 'X-API-Key') + ': ' + S.apiVal));
  if (c.isForm) {
    for (const f of (c.form || [])) parts.push('-F', shQ(f.k + '=' + f.v));
    for (const f of (c.files || [])) parts.push('-F', shQ(f.k + "=@" + f.filename));
  } else if (c.body) parts.push('--data-raw', shQ(c.body));
  return parts.join(' ');
};

/* Auto-layout berlapis: kolom per kedalaman, loop-target sekolom loop, end bersama di kolom akhir */
function flowAutoLayout() {

  const byId = {}; nodes.forEach(n => { byId[n.id] = n; });
  const outs = n => {

    if (n.kind === 'decision') { if (n.next_true && byId[n.next_true]) o.push(n.next_true); if (n.next_false && byId[n.next_false]) o.push(n.next_false); }

    return o;
  };

  const q = [start.id];
  while (q.length) { const id = q.shift(); for (const o of outs(byId[id])) { if (!(o in depth)) { depth[o] = depth[id] + 1; q.push(o); } } }

  nodes.forEach(n => { if (!outs(n).length && (indeg[n.id] || 0) > 1) depth[n.id] = maxD + 1; });
  nodes.forEach(n => { if (n.kind === 'loop' && n.loop_target && byId[n.loop_target]) depth[n.loop_target] = depth[n.id]; });

  Object.values(layers).forEach(L => { L.forEach(n => { if (depth[n.id] > maxD) maxD = depth[n.id]; }); });
  Object.values(layers).forEach(L => {
    L.sort((a, b) => (a.y - b.y) || (a.id < b.id ? -1 : 1));
    const loops = L.filter(n => n.kind === 'loop');
    loops.forEach(lp => {
      const ti = L.findIndex(n => n.id === lp.loop_target);
      const li = L.indexOf(lp);
      if (ti >= 0 && ti < li) { L.splice(ti, 1); L.splice(li, 0, byId[lp.loop_target]); }

}

  }
  const dx = Math.max(36, (x2 - x1) / 2);
  return { d: `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`, tx: (x1 + x2) / 2, ty: (y1 + y2) / 2 - 5 };
};
function flowNodeSub(n) {

}
function flowPortsHTML(n) {

}
function flowEdgesSVG(nodes) {
  const byId = {};
  nodes.forEach(n => { byId[n.id] = n; });
  const R = S.flowRun;
  const donePairs = {};
  const path = (R && R.path) || [];
  for (let i = 0; i + 1 < path.length; i++) donePairs[path[i] + '→' + path[i + 1]] = true;
  let s = '<defs><marker id="flarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#58d6b5"/></marker></defs>';
  let backSlot = 0;
  const edge = (a, field, bid, cls, tag) => {
    const b = byId[bid];
    if (!b) return '';
    const live = R && R.running && R.current === bid ? ' is-live' : '';
    const done = donePairs[a.id + '→' + bid] ? ' is-done' : '';
    const back = a.id !== bid && b.x < a.x + FLOW_NW;
    const slot = back ? backSlot++ : 0;
    const g = flowEdgeD(a, field, b, slot);
    const waited = (a.await_ids || []).includes(bid);
    const bc = (g.self || waited) ? ' is-bidir' : '';
    return `<path d="${g.d}" data-fire="${a.id}:${field}" data-fto="${bid}" data-slot="${slot}" class="flow-edge${cls ? ' ' + cls : ''}${done}${live}${bc}"/><path d="${g.d}" class="flow-hit" data-wsrc="${a.id}" data-wfield="${field}"/>` + (tag ? `<text x="${g.tx}" y="${g.ty}" class="flow-edge-tag${cls ? ' ' + cls : ''}">${tag}</text>` : '');
  };
  nodes.forEach(n => {
    s += edge(n, 'next', n.next, '');
    if (n.kind === 'decision') { s += edge(n, 'true', n.next_true, 'is-true', 'T'); s += edge(n, 'false', n.next_false, 'is-false', 'F'); }

}
function flowWireOpts(sel, exclude) {

}
function flowInspectorHTML() {
  const F = S.flowView;
  let cable = '';
  if (S.wireSel) {
    const a = (F.nodes || []).find(x => x.id === S.wireSel.src);
    const t = a ? (F.nodes || []).find(x => x.id === a[S.wireSel.field]) : null;
    if (a && t) {
      const waited = (a.await_ids || []).includes(t.id);
      cable = `<div class="flow-field"><span>Kabel ${(a.label || flowKindName(a.kind))} → ${(t.label || flowKindName(t.kind))}</span><div class="wire-type"><button type="button" class="button ${waited ? 'button--ghost' : 'button--primary'}" id="wtype1">→ 1 arah</button><button type="button" class="button ${waited ? 'button--primary' : 'button--ghost'}" id="wtype2">⇄ 2 arah</button></div>${waited ? '<small class="tab-hint" style="margin:0">2 arah: proses menunggu respons node ini sebelum lanjut.</small>' : ''}</div>`;

  if (!n) return cable || `<div class="flow-insp-empty">Klik node di kanvas untuk atur, atau tambah node dari palet di atas.</div>`;
  let body = `<label class="flow-field"><span>Label</span><input id="flabel" value="${n.label || ''}" spellcheck="false" autocomplete="off"></label>`;
  if (n.kind === 'request') {

    body += `<div class="flow-field"><span>Extract → variabel flow</span>${(n.extract || []).map((e, i) => `<div class="flow-kv"><input value="${e.var || ''}" data-fei="${i}" data-fef="var" placeholder="VAR" spellcheck="false" autocomplete="off"><input value="${e.src || ''}" data-fei="${i}" data-fef="src" placeholder="status / body / json:$.id" spellcheck="false" autocomplete="off"><button type="button" data-fexdel="${i}" aria-label="Remove extract">×</button></div>`).join('')}<button type="button" class="button button--ghost add-config" id="fextadd">＋ Extract</button></div>`;
    body += `<label class="flow-field"><span>Lanjut ke</span><select id="fnext">${flowWireOpts(n.next, n.id)}</select></label>`;

    body += `<label class="flow-field"><span>Lanjut ke</span><select id="fnext">${flowWireOpts(n.next, n.id)}</select></label>`;
  } else if (n.kind === 'loop') {
    body += `<label class="flow-field"><span>Mode</span><select id="floopmode"><option value="count"${n.loop_mode !== 'while' ? ' selected' : ''}>Ulangi N kali</option><option value="while"${n.loop_mode === 'while' ? ' selected' : ''}>While (kondisi)</option></select></label>`;
    if (n.loop_mode === 'while') body += `<div class="flow-field"><span>Ulangi selama</span>${flowCondHTML(n, 'fcond')}</div>`;
    else body += `<label class="flow-field"><span>Jumlah (max 25)</span><input id="floopcount" type="number" min="1" max="25" value="${n.loop_count || 3}"></label>`;
    body += `<label class="flow-field"><span>Awal badan loop</span><select id="flooptarget">${flowWireOpts(n.loop_target, n.id)}</select></label>`;
    body += `<label class="flow-field"><span>Keluar ke</span><select id="fnext">${flowWireOpts(n.next, n.id)}</select></label>`;
  } else if (n.kind === 'start') {

  return `<div class="flow-insp-head"><span class="flow-kind kind-${n.kind}">${flowKindIcon(n.kind)} ${flowKindName(n.kind)}</span><code>${n.id}</code><button type="button" class="icon-button" id="finspx" aria-label="Tutup panel">×</button></div>` + cable + body;
}
function flowPanelHTML() {
  const F = S.flowView;
  const nodes = F.nodes || [];

    <div class="flow-bar"><button type="button" class="button button--ghost" id="flowback">‹ Kembali</button>
      <input id="flowname" value="${F.name || ''}" aria-label="Flow name" spellcheck="false" autocomplete="off">
      <span id="flowstatus">${flowIsDirty() ? '<span class="env-dirty">• belum disimpan</span>' : '<span class="env-clean">✓ tersimpan</span>'}</span>
      <span class="flow-pal">${[['request', '＋▶'], ['decision', '＋◆'], ['setvar', '＋ϟ'], ['loop', '＋⟳'], ['end', '＋■']].map(([k, l]) => `<button type="button" class="button button--ghost" data-fadd="${k}" title="Tambah ${flowKindName(k)}">${l}</button>`).join('')}</span>
      <button type="button" class="button button--ghost" id="flowtidy" aria-label="Rapikan layout otomatis" title="Rapikan layout otomatis">🧹</button>
      <button type="button" class="button button--ghost" id="flowfocus" aria-label="Fokus ke node berjalan" title="Fokus ke node berjalan" style="display:none">🎯</button>
      <button type="button" class="button button--primary${flowIsDirty() ? ' is-dirty' : ''}" id="flowsave">💾 Save</button>
      ${R && R.running ? `<button type="button" class="button button--amber" id="flowstop">⏹ Stop</button>` : `<button type="button" class="button button--primary" id="flowrun">▶ Run</button>`}
      <button type="button" class="button button--ghost" id="flowdel" aria-label="Delete flow" title="Hapus flow">🗑</button></div>

      </div></div>
      <div class="flow-inspector" style="${(F.nodes || []).some(x => x.id === S.flowSel) || S.wireSel ? '' : 'display:none'}">${flowInspectorHTML()}</div>
    </div>
    ${S.wirePending ? `<div class="wire-veil" id="wireveil"></div><div class="wire-pop" style="left:${Math.min(S.wirePending.cx, window.innerWidth - 260)}px;top:${Math.min(S.wirePending.cy, window.innerHeight - 170)}px" role="dialog" aria-label="Tipe kabel"><span class="eyebrow">KABEL</span><button type="button" class="button button--primary" id="wire1">→ 1 arah</button><button type="button" class="button button--ghost" id="wire2">⇄ 2 arah • tunggu respons</button></div>` : ''}

    <p class="tab-hint">Drag node untuk pindah • drag kabel dari port output (kanan) ke port input (kiri) untuk sambung • klik kabel + Delete untuk putus • drag dari port input ke area kosong juga putus • loop: badan loop diakhiri node yang balik ke node Loop.</p>

async function runScope(colName, folName) {
  const col = S.cols.find(x => x.name === colName); if (!col) return;
  const items = [];
  const push = (r, fol) => items.push({ name: (fol ? fol + ' / ' : '') + r.name, method: r.method, url: r.url, body: r.body || '', headers: flatHeaders(r.headers), params: r.params || [], tests: r.tests || [], prescript: r.prescript || '', body_mode: r.body_mode || 'json', form: (r.form || []).filter(f => f.t !== 'file'), authMode: r.authMode || 'none', st: 'wait', code: 0, ms: 0 });
  if (folName) { const fo = col.folders.find(x => x.name === folName); (fo ? fo.requests : []).forEach(r => push(r, folName)); }
  else { col.requests.forEach(r => push(r, '')); col.folders.forEach(f => f.requests.forEach(r => push(r, f.name))); }
  if (!items.length) return;
  S.run = { scope: folName ? colName + ' / ' + folName : colName, items, running: true, pass: 0 };
  render();
  for (let n = 0; n < items.length; n++) {
    if (!S.run || !S.run.running) break;
    const it = items[n]; it.st = 'run'; render();
    try {
      let url = it.url;
      const qs = (it.params || []).filter(p => p.on !== false && (p.k || '').trim()).map(p => encodeURIComponent(p.k.trim()) + '=' + encodeURIComponent(p.v || '')).join('&');
      if (qs) url += (url.includes('?') ? '&' : '?') + qs;
      const headers = { ...it.headers };
      const isForm = it.body_mode === 'form';
      if (!isForm && !Object.keys(headers).some(k => k.toLowerCase() === 'content-type')) headers['Content-Type'] = 'application/json';
      const pre = applyPrescript(url, headers, it.prescript);
      url = pre.url;
      if (pre.delay) await new Promise(r => setTimeout(r, pre.delay));
      const form = (it.form || []).filter(f => f.on !== false && (f.k || '').trim()).map(f => ({ k: f.k.trim(), v: f.v || '' }));
      const auth = ['bearer', 'basic', 'apikey'].includes(it.authMode) ? { mode: it.authMode, token: S.token, user: S.basicUser, pass: S.basicPass, key: S.apiKey, val: S.apiVal } : { mode: 'none' };
      const out = await api('/api/send', { method: it.method, url, headers, body: isForm ? '' : it.body, form, files: [], env: S.env, auth });
      const R = out.result;
      const tr = R ? runTests(it.tests, R) : [];
      const ok = R ? (tr.length ? tr.every(t => t.ok) : R.status < 400) : false;
      it.st = ok ? 'ok' : 'fail'; it.ms = R ? R.ms : 0; it.code = R ? R.status : 0;
      if (ok && S.run) S.run.pass++;
    } catch (e) { it.st = 'fail'; it.code = 0; }
    render();
  }
  if (S.run) S.run.running = false;
  render();
}

async function send() {
  const q = cur();
  if (!q || S.sending) return;
  const needCred = q.authMode === 'bearer' ? !S.token.trim() : q.authMode === 'basic' ? !S.basicUser.trim() : q.authMode === 'apikey' ? !S.apiVal.trim() : false;
  if (needCred) { S.tab = 'Auth'; render(); return; }
  const c = await composeSend(q);
  if (c.delay) await new Promise(r => setTimeout(r, c.delay));
  S.sending = true; render();
  try {
    const out = await api('/api/send', { method: q.method, url: c.url, headers: c.headers, body: c.isForm ? '' : c.body, form: c.form, files: c.files, env: S.env, auth: ['bearer', 'basic', 'apikey'].includes(q.authMode) ? { mode: q.authMode, token: S.token, user: S.basicUser, pass: S.basicPass, key: S.apiKey, val: S.apiVal } : { mode: 'none' } });
    S.resp = out.result || null;
    S.lastUrl = c.url;
    if (S.resp) storeJar(c.url, S.resp);
    S.testRes = S.resp ? runTests(q.tests, S.resp) : null;
    pushHist(q, S.resp);
    if (S.resp && S.resp.status !== 500) {
      if (S.resp.status < 400) {
        if (S.quest.done < S.quest.goal) S.quest.done++;
        if (S.resp.ms < 200) S.fast.push(Date.now());
        saveStats();
      }
      S.mood = 'happy'; S.moodUntil = Date.now() + 2500; S.seq = { frames: ['senyum', 'matatertutup', 'senanghati', 'excited', 'malu', 'tertawa'], t0: Date.now(), step: 320, dur: 2500, bounce: true }; setTimeout(() => render(), 2600);
    } else if (S.resp) {
      S.mood = 'err500'; S.moodUntil = Date.now() + 3000; setTimeout(() => render(), 3100);
    }
  } catch { S.resp = null; S.testRes = null; pushHist(q, null); S.mood = 'dizzy'; S.moodUntil = Date.now() + 2500; setTimeout(() => render(), 2600); }
  S.sending = false; render();
}

async function load() {
  const t = await api('/api/tree');
  S._serverCols = (t.cols || []).map(g => g.name);
  S.cols = (t.cols || []).map(g => ({ name: g.name, icon: g.icon || '', requests: (g.requests || []).map(r => ({ file: r.file, name: r.name, method: r.method, url: r.url, body: r.body || '', params: (r.params || []).map(p => ({ k: p.k || '', v: p.v || '', on: p.on !== false })), tests: (r.tests || []).map(t => ({ t: t.t || 'status', v: t.v || '', on: t.on !== false })), prescript: r.prescript || '', body_mode: r.body_mode === 'form' ? 'form' : 'json', form: (r.form || []).map(f => ({ k: f.k || '', v: f.v || '', t: f.t === 'file' ? 'file' : 'text', on: f.on !== false })), headers: normHeaders(r.headers), authMode: ['bearer', 'basic', 'apikey'].includes(r.auth_mode) ? r.auth_mode : 'none' })), folders: (g.folders || []).map(f => ({ name: f.name, icon: f.icon || '', requests: (f.requests || []).map(r => ({ file: r.file, name: r.name, method: r.method, url: r.url, body: r.body || '', params: (r.params || []).map(p => ({ k: p.k || '', v: p.v || '', on: p.on !== false })), tests: (r.tests || []).map(t => ({ t: t.t || 'status', v: t.v || '', on: t.on !== false })), prescript: r.prescript || '', body_mode: r.body_mode === 'form' ? 'form' : 'json', form: (r.form || []).map(f => ({ k: f.k || '', v: f.v || '', t: f.t === 'file' ? 'file' : 'text', on: f.on !== false })), headers: normHeaders(r.headers), authMode: ['bearer', 'basic', 'apikey'].includes(r.auth_mode) ? r.auth_mode : 'none' })) })) }));
  S.envs = t.envs || [];
  S.flows = flowMapList(t);
  if (S.envs[0]) S.env = S.envs[0].name.toUpperCase();
  if (S.sel && !cur() && flatCount()) S.sel = { c: 0, f: -1, i: 0 };
  validTabs();
  render();
}
load();
